# Fast path: check and publish the self-hosted dashboard image on Blacksmith
# runners, outside the shared GitHub-hosted queue. Anyone with write access
# (people or agents) may start it; nothing runs until Khaliq approves the
# fast-path environment.
#
# It runs the same checks as Dashboard CI (npm run check: lint, tests, build)
# and pushes one linux/amd64+linux/arm64 build to the same repositories as
# container.yml (relay-webapp and the legacy relay-dashboard name), tagged
# fast-<sha> and sha-<sha> only. It never moves a channel tag (no :main,
# :latest or semver) and does not notify infra of a release candidate. Pin the
# digest printed in the run summary.
#
# No signed GitHub attestation is pushed: attest-build-provenance records the
# dispatch commit, not the `ref` actually built. BuildKit's SBOM and max-mode
# provenance (which read the checkout) are attached to the image.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (a PR branch is fine)
        required: true
        default: main
      reason:
        description: Why this needs the fast path
        required: true
permissions:
  contents: read
# run_id keeps a run that waits for approval from displacing (cancelling) another
# pending dispatch of the same ref.
concurrency:
  group: fast-path-${{ inputs.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/agentworkforce/relay-webapp
  LEGACY_IMAGE: ghcr.io/agentworkforce/relay-dashboard
jobs:
  check:
    environment: fast-path
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:fast-${{ needs.check.outputs.sha }}
            ${{ env.IMAGE }}:sha-${{ needs.check.outputs.sha }}
            ${{ env.LEGACY_IMAGE }}:fast-${{ needs.check.outputs.sha }}
            ${{ env.LEGACY_IMAGE }}:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Agent Relay dashboard
            org.opencontainers.image.description=Self-hosted Agent Relay dashboard
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
          build-args: SOURCE_REVISION=${{ needs.check.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.check.outputs.sha }}
          REASON: ${{ inputs.reason }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### relay-web fast path"
            echo "- ref: \`$REF\` at \`$SHA\`"
            echo "- reason: $REASON"
            echo "- image: \`${IMAGE}@${DIGEST}\` (tags fast-$SHA, sha-$SHA)"
            echo "- legacy name, same digest: \`${LEGACY_IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
